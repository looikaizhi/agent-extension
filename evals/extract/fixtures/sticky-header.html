<!doctype html><html lang="en"><head><meta charset="utf-8"><title>sticky header 覆盖目标</title>
<style>body{font:14px system-ui;margin:0;padding:16px}section{margin:12px 0}
button,a{font:inherit}h2{font-size:15px;margin:8px 0}</style></head><body>

<style>.bar{position:sticky;top:0;background:#eee;padding:10px;z-index:5}</style>
<div class="bar"><button>Global search</button></div>
<main style="height:1200px"><h1>Report</h1>
<section aria-label="Summary"><h2>Summary</h2><button data-eval="sticky-target">Export CSV</button></section>
</main>
</body></html>
