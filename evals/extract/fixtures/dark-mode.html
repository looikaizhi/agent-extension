<!doctype html><html lang="en"><head><meta charset="utf-8"><title>暗色模式</title>
<style>body{font:14px system-ui;margin:0;padding:16px}section{margin:12px 0}
button,a{font:inherit}h2{font-size:15px;margin:8px 0}</style></head><body>

<style>@media(prefers-color-scheme:dark){body{background:#111;color:#eee}}
body{background:#111;color:#eee}button{background:#222;color:#eee;border:1px solid #444}</style>
<main><h1>Theme</h1><section aria-label="Appearance"><h2>Appearance</h2>
<button data-eval="dark-apply">Apply theme</button></section></main>
</body></html>
