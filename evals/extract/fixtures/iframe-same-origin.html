<!doctype html><html lang="en"><head><meta charset="utf-8"><title>同源 iframe</title>
<style>body{font:14px system-ui;margin:0;padding:16px}section{margin:12px 0}
button,a{font:inherit}h2{font-size:15px;margin:8px 0}</style></head><body>

<main><h1>Embedded console</h1>
<section role="region" aria-label="Frame host"><h2>Frame host</h2>
<iframe title="Inner console" srcdoc="&lt;button id=x&gt;Restart service&lt;/button&gt;" width="360" height="90"></iframe>
</section>
<button data-eval="outer-only">Outer action</button></main>
</body></html>
