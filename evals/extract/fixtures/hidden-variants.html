<!doctype html><html lang="en"><head><meta charset="utf-8"><title>各种不可见形态都必须排除</title>
<style>body{font:14px system-ui;margin:0;padding:16px}section{margin:12px 0}
button,a{font:inherit}h2{font-size:15px;margin:8px 0}</style></head><body>

<style>.a{display:none}.b{visibility:hidden}.c{opacity:0}.d{width:0;height:0;padding:0;border:0;overflow:hidden}</style>
<main><h1>Visibility</h1>
<section aria-label="Real"><h2>Real</h2><button data-eval="visible-one">Confirm</button></section>
<button class="a">Hidden display</button><button class="b">Hidden visibility</button>
<button class="c">Hidden opacity</button><button class="d">Hidden zero</button>
<div aria-hidden="true"><button>Hidden aria</button></div></main>
</body></html>
