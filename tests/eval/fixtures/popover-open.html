<!doctype html><html lang="en"><head><meta charset="utf-8"><title>页面自己的 popover 打开时</title>
<style>body{font:14px system-ui;margin:0;padding:16px}section{margin:12px 0}
button,a{font:inherit}h2{font-size:15px;margin:8px 0}</style></head><body>

<main><h1>Account</h1>
<button popovertarget="menu">Open menu</button>
<div popover="auto" id="menu"><button data-eval="popover-item">Sign out</button></div>
<button>Other action</button></main>
<script>document.getElementById('menu').showPopover();</script>
</body></html>
