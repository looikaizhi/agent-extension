<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fake Console</title>
    <style>
      body { font: 14px system-ui; margin: 0; }
      nav { background: #1f2937; color: #fff; padding: 10px 16px; display: flex; gap: 14px; }
      nav a { color: #cbd5e1; }
      main { padding: 20px; max-width: 900px; }
      table { border-collapse: collapse; width: 100%; margin-top: 8px; }
      th, td { border: 1px solid #e5e7eb; padding: 6px 8px; text-align: left; }
      .hidden-display { display: none; }
      .hidden-vis { visibility: hidden; }
      .hidden-op { opacity: 0; }
      .zero { width: 0; height: 0; padding: 0; border: 0; overflow: hidden; }
      /* A hostile competitor for the overlay: max z-index, full screen. */
      #evil { position: fixed; inset: 0; z-index: 2147483647; background: rgba(255,0,0,.08);
              pointer-events: none; }
      /* Tall enough that the button below it lands outside ±1 viewport (860px
         tall in e2e), which the previous 1400px did not achieve — the button
         was the div's *first* child, so it sat at ~1200px and stayed in band. */
      .tall { height: 3000px; }
    </style>
  </head>
  <body>
    <nav aria-label="Global">
      <a href="/home">Home</a>
      <a href="/billing">Billing</a>
      <!-- 跨页引导 demo 的第 1 步目标 -->
      <a href="/docs">Docs</a>
      <button id="nav-help">Help</button>
    </nav>

    <main>
      <h1>Instances</h1>
      <section aria-label="Instances">
        <h2>Running instances</h2>
        <table>
          <thead>
            <tr><th>Name</th><th>State</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>i-0abc123de</td><td>running</td>
              <td><button>Stop</button> <button>Terminate</button></td>
            </tr>
            <tr>
              <td>i-0f99887c</td><td>running</td>
              <td><button>Stop</button> <button>Terminate</button></td>
            </tr>
            <tr>
              <td>i-0dd44221</td><td>stopped</td>
              <td><button>Start</button> <button>Terminate</button></td>
            </tr>
          </tbody>
        </table>
        <button id="create">Create instance</button>
      </section>

      <section aria-label="Credentials">
        <h2>Credentials</h2>
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" />
        <label for="proj">Project name</label>
        <input id="proj" type="text" />
        <a href="/help/password-policy">Password policy</a>
      </section>

      <section aria-label="Hidden things">
        <button class="hidden-display">Never visible display</button>
        <button class="hidden-vis">Never visible visibility</button>
        <button class="hidden-op">Never visible opacity</button>
        <button class="zero">Never visible zero</button>
        <div aria-hidden="true"><button>Inside aria-hidden</button></div>
        <div inert><button>Inside inert</button></div>
      </section>

      <section aria-label="Web components">
        <h2>Shadow area</h2>
        <my-widget></my-widget>
        <!-- F-10: ancestors and row identity must cross the shadow boundary.
             Both `parentElement` and `closest()` stop at the root, so before the
             fix every control in here had an empty path — and the fixture still
             reported ambiguity 0%, because nothing inside was ever compared. -->
        <shadow-table></shadow-table>
      </section>

      <!-- F-10: heading judged by role, not tag name. The old
           /^h[1-6]$/ test dropped this entire section label. -->
      <section aria-label="Divheadings">
        <div role="heading" aria-level="2">Access tokens</div>
        <button>Reveal</button>
        <div role="heading" aria-level="2">Deploy keys</div>
        <button>Reveal</button>
      </section>

      <!-- F-12: `textContent` ran these together as 'Latest commit 3 peoplebump deps'. -->
      <section aria-label="Commits">
        <table>
          <tbody>
            <tr>
              <td><span>Latest commit</span><span>3 people</span><span>bump deps</span></td>
              <td><button>Revert</button></td>
            </tr>
          </tbody>
        </table>
      </section>

      <div class="tall"></div>
      <button id="far-below">Far below the fold</button>
    </main>

    <div id="evil"></div>

    <script>
      class MyWidget extends HTMLElement {
        connectedCallback() {
          const r = this.attachShadow({ mode: 'open' });
          r.innerHTML =
            '<button id="shadow-btn">Inside shadow DOM</button>' +
            '<button id="shadow-btn2">Deeper</button>';
        }
      }
      customElements.define('my-widget', MyWidget);

      // A landmark, a heading and a table row that all live *inside* a shadow
      // root, so `path` can only be built by walking out through the host.
      class ShadowTable extends HTMLElement {
        connectedCallback() {
          const r = this.attachShadow({ mode: 'open' });
          r.innerHTML =
            '<section role="region" aria-label="Shadow region">' +
            '<h3>Shadow keys</h3>' +
            '<table><tbody>' +
            '<tr><td>key-alpha</td><td><button>Rotate</button></td></tr>' +
            '<tr><td>key-beta</td><td><button>Rotate</button></td></tr>' +
            '</tbody></table>' +
            '</section>';
        }
      }
      customElements.define('shadow-table', ShadowTable);
    </script>
  </body>
</html>
